<style>
:root{color-scheme:light;--bg:#F4F5F3;--surface:#FFFFFF;--surface2:#F4F5F3;--text:#1B1F1D;--text2:#3F4743;--muted:#5C6460;--border:#E1E4E1;--border2:#D5D9D5;--border3:#E4E7E4;--border4:#E7EAE7;--line:#EEF0EE;--accent:#007A3D;--accent2:#005C2E;--accent-soft:#E6F3EB;--accent-soft2:#D5EDE0;--accent-border:#BFE3CE;--chip-n:#D9F0E3;--on-accent:#FFFFFF;--row-hover:#FAFBFA;--disabled:#8A918D;--track:#C9CEC9;--knob:#FFFFFF;--danger-bg:#FFF4F2;--danger-border:#F2C9C2;--danger-text:#8A1F11;}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121412;--surface:#1C201E;--surface2:#272C29;--text:#E9ECE9;--text2:#C3CAC5;--muted:#99A29C;--border:#333936;--border2:#3C4440;--border3:#2B302D;--border4:#2B302D;--line:#2A2F2C;--accent:#2FBE78;--accent2:#8BE4B8;--accent-soft:#1C3327;--accent-soft2:#244130;--accent-border:#2F5A43;--chip-n:#0E2419;--on-accent:#0B1A12;--row-hover:#222724;--disabled:#767E79;--track:#434A46;--knob:#E8EBE8;--danger-bg:#2E1C19;--danger-border:#5E3A33;--danger-text:#FF9D8D;}
img{color-scheme:light}
body{margin:0;background:var(--bg)}
a{color:var(--accent)}a:hover{color:var(--accent2)}
.chip{font:inherit;font-size:13px;line-height:1.2;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip[aria-pressed="true"] .n{color:var(--chip-n)}
.chip:disabled{color:var(--disabled);background:var(--surface2);cursor:default;border-color:var(--border3)}
.chip .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg{font:inherit;font-size:14px;font-weight:500;min-height:44px;padding:0 16px;border:0;border-radius:8px;background:transparent;color:var(--text2);cursor:pointer}
.seg[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sw{font:inherit;font-size:14px;font-weight:500;color:var(--text);background:none;border:0;padding:0 4px;min-height:44px;display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.sw .track{position:relative;width:51px;height:31px;border-radius:16px;background:var(--track);transition:background .2s;flex:none}
.sw .knob{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--knob);box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"] .track{background:var(--accent)}
.sw[aria-checked="true"] .knob{transform:translateX(20px)}
.idbtn{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;font-weight:500;color:var(--accent2);background:var(--accent-soft);border:0;border-radius:6px;padding:0 8px;min-height:32px;cursor:pointer;white-space:nowrap}
.idbtn:hover{background:var(--accent-soft2)}
.row:hover{background:var(--row-hover)}
.speclink{font:inherit;font-size:14px;font-weight:600;line-height:1.2;min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;box-sizing:border-box}
.speclink:hover{background:var(--accent-soft);color:var(--accent2)}
.speclink{white-space:nowrap}
.facttile{background:var(--surface2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
a.facttile{text-decoration:none;color:inherit;border:1px solid var(--accent-border);background:var(--accent-soft)}
a.facttile:hover{background:var(--accent-soft2)}
.facttile .k{font-size:12px;color:var(--muted)}
.facttile .v{font-size:15px;font-weight:600;overflow-wrap:anywhere}
a.facttile .v{color:var(--accent2)}
.thumbbtn{font:inherit;border:1px solid transparent;padding:0;cursor:pointer;box-sizing:border-box}
.thumbbtn:hover{border-color:var(--accent)}
.selall{font:inherit;font-size:12px;font-weight:600;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline dashed;text-underline-offset:3px}
.selall:hover{color:var(--accent2)}
.kpbox{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
.facttile.wide{grid-column:span 2}
@media (max-width:400px){.facttile.wide{grid-column:auto}}
.card{transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.cardbtn{font:inherit;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:12px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media print{
:root,:root[data-theme="dark"]{color-scheme:light;--bg:#FFFFFF;--surface:#FFFFFF;--surface2:#F4F5F3;--text:#1B1F1D;--text2:#3F4743;--muted:#5C6460;--border:#E1E4E1;--border2:#D5D9D5;--border3:#E4E7E4;--border4:#E7EAE7;--line:#EEF0EE;--accent:#007A3D;--accent2:#005C2E;--accent-soft:#E6F3EB;--accent-soft2:#D5EDE0;--accent-border:#BFE3CE;--chip-n:#D9F0E3;--on-accent:#FFFFFF;--row-hover:#FFFFFF;--disabled:#8A918D;--track:#C9CEC9;--knob:#FFFFFF;--danger-bg:#FFF4F2;--danger-border:#F2C9C2;--danger-text:#8A1F11}
@page{margin:12mm}
body{background:#FFFFFF}
.noprint{display:none!important}
body:has(.overlay) .page{display:none!important}
.overlay{position:static!important;background:none!important;padding:0!important;overflow:visible!important;display:block!important}
.sheet{box-shadow:none!important;max-width:none!important;border-radius:0!important;padding:0!important;gap:16px!important}
.sheet button.speclink{display:none!important}
.sheet img,.sheet figure,.sheet .facttile{break-inside:avoid}
.sheet table{max-height:none!important}
}

#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);z-index:100;box-sizing:border-box}
#gate form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;box-sizing:border-box}
#gate h1{margin:0;font-size:18px;font-weight:700}
#gate p{margin:0;font-size:13px;color:var(--muted)}
#gate label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
#gate input{font:inherit;font-size:15px;min-height:44px;padding:0 12px;border:1px solid var(--border2);border-radius:10px;background:var(--surface);color:var(--text);box-sizing:border-box}
#gate button{font:inherit;font-size:15px;font-weight:600;min-height:44px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);cursor:pointer}
#gate button:disabled{opacity:.6;cursor:default}
#gate .err{font-size:13px;color:var(--danger-text);min-height:18px}
</style>
</head>
<body>
<div id="gate"><form id="gateform" autocomplete="on">
<h1>Каталог навигации ГКБ №7</h1>
<p>Страница доступна по логину и паролю.</p>
<label>Логин<input id="gl" name="username" type="text" autocomplete="username" required></label>
<label>Пароль<input id="gp" name="password" type="password" autocomplete="current-password" required></label>
<button id="gb" type="submit">Войти</button>
<div class="err" id="ge"></div>
</form></div>
<div id="app" style="display:none"></div>
<noscript>Для работы каталога нужен JavaScript.</noscript>
<script type="text/plain" id="tpl">
<div style="font-family: Inter, system-ui, sans-serif; color: var(--text); background: var(--bg); min-height: 100vh">
  <header class="page" style="background: var(--surface); border-bottom: 1px solid var(--border)">
    <div style="max-width: 1440px; margin: 0 auto; padding: 24px 32px; box-sizing: border-box">
    <div style="display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-start; justify-content: space-between; margin-bottom: 6px">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent)">ГКБ №7 · Система навигации</div>
      <button type="button" class="sw" role="switch" aria-checked="{{darkOn}}" onClick="{{toggleTheme}}" style="min-height: 0">Тёмная тема<span class="track" aria-hidden="true"><span class="knob"></span></span></button>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 30px; line-height: 1.15; font-weight: 700">Каталог элементов навигации</h1>
        <p style="margin: 0; font-size: 14px; color: var(--muted); max-width: 640px">Фильтруйте указатели по этажам, блокам и техническим характеристикам. Этаж и блок берутся из ID: q1<b>10</b>-<b>1</b>-81 — блок 10, этаж 1, элемент №81. Этаж 111 означает «все этажи».</p>
        <div style="font-size: 13px; color: var(--muted); margin-top: 10px">Автор: <a href="https://wa.me/77012142992" target="_blank" rel="noopener" style="color: var(--accent); font-weight: 600; text-decoration-line: none">Тимур Ходжаев</a></div>
      </div>
      <div style="display: flex; gap: 24px; flex-wrap: wrap">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums">{{stats.shown}}</div>
          <div style="font-size: 12px; color: var(--muted)">{{stats.totalLabel}}</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums">{{stats.types}}</div>
          <div style="font-size: 12px; color: var(--muted)">{{stats.typesLabel}}</div>
        </div>
      </div>
    </div>
    </div>
  </header>

  <div class="page" style="max-width: 1440px; margin: 0 auto; padding: 24px 32px 64px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; box-sizing: border-box">

    <aside aria-label="Фильтры" style="flex: 1 1 300px; max-width: 360px; min-width: 0; display: flex; flex-direction: column; gap: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-sizing: border-box">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">Фильтры</h2>
        <button type="button" class="chip" onClick="{{reset}}" disabled="{{noFilters}}">Сбросить</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="q" style="font-size: 13px; font-weight: 600">Поиск</label>
        <input id="q" type="search" value="{{q}}" onInput="{{onQ}}" placeholder="ID, тип, размер…" style="font: inherit; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid var(--track); border-radius: 10px; background: var(--surface); color: var(--text); box-sizing: border-box; width: 100%"/>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="typeSel" style="font-size: 13px; font-weight: 600">Тип</label>
        <select id="typeSel" value="{{typeSel}}" onChange="{{onType}}" style="font: inherit; font-size: 14px; min-height: 44px; padding: 0 10px; border: 1px solid var(--track); border-radius: 10px; background: var(--surface); color: var(--text); width: 100%">
          <option value="">Все типы</option>
          <sc-for list="{{typeOptions}}" as="to" hint-placeholder-count="5">
            <option value="{{to.value}}">{{to.label}}</option>
          </sc-for>
        </select>

(function(){

window.DCLogic.prototype.forceUpdate=function(){schedule();};
function schedule(){if(pending)return;pending=true;Promise.resolve().then(function(){pending=false;render();});}

function get(path,sc){path=path.trim();if(path==='true')return true;if(path==='false')return false;var p=path.split('.'),v;
  for(var s=sc;s;s=s.parent){if(p[0] in s.vars){v=s.vars[p[0]];break;}}
  for(var i=1;i<p.length&&v!=null;i++)v=v[p[i]];return v;}
var WHOLE=/^\s*\{\{([^}]+)\}\}\s*$/,HOLE=/\{\{([^}]+)\}\}/g;
function interp(t,sc){return t.replace(HOLE,function(_,p){var v=get(p,sc);return v==null?'':String(v);});}
function build(node,sc,out){
  if(node.nodeType===3){var t=interp(node.nodeValue,sc);if(t)out.appendChild(document.createTextNode(t));return;}
  if(node.nodeType!==1)return;
  var name=node.localName,i,c;
  if(name==='sc-if'){if(get(node.getAttribute('value').replace(/[{}]/g,''),sc))for(c=node.firstChild;c;c=c.nextSibling)build(c,sc,out);return;}
  if(name==='sc-for'){var list=get(node.getAttribute('list').replace(/[{}]/g,''),sc)||[],as=node.getAttribute('as');
    for(i=0;i<list.length;i++){var vars={};vars[as]=list[i];vars.$index=i;for(c=node.firstChild;c;c=c.nextSibling)build(c,{vars:vars,parent:sc},out);}return;}
  var el=document.createElement(name),later=null;
  for(i=0;i<node.attributes.length;i++){var a=node.attributes[i],n=a.name,m=WHOLE.exec(a.value),v=m?get(m[1],sc):interp(a.value,sc);
    if(/^on[A-Z]/.test(n)){if(typeof v==='function')el.addEventListener(n.slice(2).toLowerCase(),v);}
    else if(n==='disabled'){if(v&&v!=='false')el.disabled=true;}
    else if(n==='checked'){if(v&&v!=='false')el.checked=true;}
    else if(n==='value'&&(name==='select'||name==='input')){later=v;}
    else if(v!=null&&v!==false)el.setAttribute(n,v===true?'':String(v));}
  for(c=node.firstChild;c;c=c.nextSibling)build(c,sc,el);
  if(later!=null)el.value=later;
  out.appendChild(el);}

  var ae=document.activeElement,fid=ae&&ae.id,ss=null,se=null;
  try{if(fid&&ae.selectionStart!=null){ss=ae.selectionStart;se=ae.selectionEnd;}}catch(e){}
  var frag=document.createDocumentFragment(),sc={vars:comp.renderVals(),parent:null};
  for(var c=doc.documentElement.firstChild;c;c=c.nextSibling)build(c,sc,frag);
  root.replaceChildren(frag);
  if(fid){var n=document.getElementById(fid);if(n){n.focus({preventScroll:true});try{if(ss!=null)n.setSelectionRange(ss,se);}catch(e){}}}
  document.documentElement.style.overflow=sc.vars.modal?'hidden':'';
}

})();

      keys.sort(f.sort || ((a, b) => (a === NA) - (b === NA) || a.localeCompare(b, 'ru', { numeric: true })));
      const s = sel[f.key] || [];
      return {
        label: f.label,
        options: keys.map((v) => ({
          label: f.fmt ? f.fmt(v) : v,
          show: v in all,
          count: all[v] || 0,
          pressed: s.indexOf(v) >= 0 ? 'true' : 'false',
          disabled: !all[v] && s.indexOf(v) < 0,
          toggle: () => this.toggle(f.key, v)
        }))
      };
    });

    const activeChips = [];
    FACETS.forEach((f) => (sel[f.key] || []).forEach((v) => activeChips.push({ label: f.label + ': ' + (f.fmt ? f.fmt(v) : v), remove: () => this.toggle(f.key, v) })));
    if (typeSel) activeChips.push({ label: 'Тип: ' + typeSel, remove: () => this.setState({ typeSel: '' }) });

    const typeKeys = Object.keys(types).sort((a, b) => typeNum(a) - typeNum(b));
    const typeOptions = typeKeys.map((k) => ({ value: k, label: k + ' — ' + types[k].title + (types[k].dims ? ', ' + types[k].dims : '') }));

    const openEl = (id) => () => { hashSet(id); this.setState({ open: { kind: 'el', id: id }, showSpec: false, shareMsg: '' }); };
    const rows = filtered.map((e) => {
      const t = this.typeOf(e);
      return {
        id: e.id, hasQty: !!e.qty, qtyLabel: e.qty ? this.qtyIn(e, null) + ' шт.' : '', type: e.type || '—', cls: e.cls || '—', title: t.title, sub: t.sub || '—',
        dims: t.dims ? noMm(t.dims) : '—', height: t.height || '—', mount: t.mount || '—',
        floorLabel: e.rooms ? floorsLabel(distinctOf(this.roomsFor(e, null), 'floor')) : floorLabel(e.floor),
        blockLabel: e.rooms ? blocksLabel(this.roomsFor(e, null), e.rooms) : (e.block == null ? '—' : e.block),
        img: e.design || (t.img && t.img[0] ? t.img[0] : ''), noImg: !(e.design || (t.img && t.img[0])),
        checked: !!this.state.kp[e.id], toggleKp: () => this.toggleKp(e.id),
        open: openEl(e.id)
      };
    });

    const byType = {};
    filtered.forEach((e) => { const k = e.type || '—'; (byType[k] = byType[k] || []).push(e); });
    const cards = Object.keys(byType).sort((a, b) => typeNum(a) - typeNum(b)).map((k) => {
      const t = types[k] || EMPTY_TYPE;
      const list = byType[k];
      return {
        type: k, cls: t.cls || '—', title: t.title, sub: t.sub || '—', dims: t.dims || 'Габариты не указаны',
        img: sampleDesign[k] || '', noImg: !sampleDesign[k],
        countLabel: list.reduce((s, e) => s + this.qtyIn(e, null), 0) + ' шт. в выборке',
        ids: list.map((e) => ({ id: e.id, open: openEl(e.id) })),
        open: () => { hashSet(k); this.setState({ open: { kind: 'type', id: k }, showSpec: false, shareMsg: '' }); }
      };
    });

    let d = null;
    if (open && data) {
      const el = open.kind === 'el' ? (els.filter((e) => e.id === open.id)[0] || null) : null;
      const tk = el ? el.type : open.id;
      const t = types[tk] || EMPTY_TYPE;
      const specRows = [
        ['Тип', tk || '—'], ['Класс', t.cls || (el && el.cls)], ['Вид элемента', t.title], ['Конструкция', t.sub],
        ['Габариты', t.dims], ['Высота от пола', t.height], ['Лицевая сторона', t.face], ['Задняя сторона', t.back],
        ['Торец', t.edge], ['Каркас', t.frame], ['Основание', t.base], ['Защита', t.protection],
        ['Крепление', t.mount], ['Способ нанесения', t.print], ['Подсветка', t.placement === 'Световая проекция' ? 'гобо-проекция' : t.light],
        ['Проектор', t.projector], ['Макс. электропотребление', t.power]
      ].filter((r) => r[1]).map((r) => ({ k: r[0], v: r[1] }));
      const anyFilter = !!q || !!typeSel || FACETS.some((f) => (sel[f.key] || []).length > 0);
      const sibPool = filtered.indexOf(el) === -1 && el ? filtered.concat([el]).sort(cmpEl) : filtered;
      const sibs = sibPool.filter((e) => e.type === tk).sort(cmpEl);
      const sp = t.specPages || [];
      const spImgs = sp.filter((s) => s.img && !s.href);
      const pgs = (t.pages || []).slice().sort((a, b) => a - b);
      const pgLabel = pgs.length === 0 ? '' : (pgs.length === 1 ? ', стр. ' + pgs[0] : ', стр. ' + pgs[0] + '–' + pgs[pgs.length - 1]);
      const aiName = el && el.srcFile ? el.srcFile : '';
      const aiUrl = el && el.srcUrl ? el.srcUrl : '';
      const elRooms = el && el.rooms ? this.roomsFor(el, null) : [];
      const elFacts = el && el.rooms ? [
        { k: 'Этажи', v: distinctOf(elRooms, 'floor').join(', ') || '—' },
        { k: 'Блоки', v: blocksLabel(elRooms, el.rooms) || '—' },
        { k: 'Количество табличек', v: platesOf(elRooms) + ' из ' + platesOf(el.rooms) + ' шт.' },
        { k: 'Реестр', v: 'общий ID на все таблички; распределение — список-кабинетов-гкб7.xlsx' }
      ] : el && el.any ? [
        { k: 'Этаж', v: 'Все этажи' },
        { k: 'Размещение', v: 'Все пронумерованные кабинеты' },
        { k: 'Количество', v: el.qty + ' шт.' },
        { k: 'Реестр', v: 'общий ID на все таблички; в реестре PDF отсутствует' }
      ] : el ? [
        { k: 'Этаж', v: floorLabel(el.floor) },
        { k: 'Блок', v: el.block == null ? 'Улица' : String(el.block) },
        { k: 'Порядковый номер', v: String(el.n) + (/f$/.test(el.id) ? ' (флажок)' : '') },
        { k: 'Количество', v: qtyOf(el) + ' шт.' }
      ].concat(el.dupNote ? [{ k: 'Примечание', v: 'ID встречается в реестре дважды' }] : []) : [];
      d = {
        isEl: !!el, kicker: el ? 'Элемент навигации' : 'Тип элемента', heading: el ? el.id : (tk || '—'),
        type: tk || '', title: t.title, sub: t.sub || (t.cls || ''),
        hasImg: !!(el ? el.design : sampleDesign[tk]),
        imgs: el
          ? (el.design ? [{ src: el.design, cap: '' }] : [])
          : (sampleDesign[tk] ? [{ src: sampleDesign[tk], cap: 'Пример дизайна элемента навигации типа ' + (tk || '') }] : []),
        elFacts: elFacts, specs: specRows,
        listUrl: t.listUrl || '', hasList: !!t.listUrl,
        hasSpec: !!el && sp.length > 0, hasSpecType: !el && sp.length > 0,
        specLinks: sp.filter((s) => s.href).map((s) => ({ href: s.href, label: s.label })),
        hasSpecBtn: spImgs.length > 0,
        specOpen: this.state.showSpec ? 'true' : 'false',
        specBtnLabel: this.state.showSpec ? 'Скрыть страницу спецификации' : 'Смотреть в спецификации: ' + (tk || ''),
        specTileK: (pgs.length > 1 ? 'Страницы' : 'Страница') + ' спецификации',
        specTileV: pgs.length ? pgs.join(', ') : 'нет описания в документе',
        aiName: aiName, hasAiPlain: !!aiName && !aiUrl, hasAiLink: !!aiName && !!aiUrl, aiHref: aiUrl,
        specShown: this.state.showSpec && spImgs.length > 0,
        specImgs: spImgs.map((s) => ({ src: s.img, cap: s.label })),
        hasRooms: elRooms.length > 0,
        roomsLabel: 'Кабинеты в выборке: ' + elRooms.length + ', табличек: ' + platesOf(elRooms) + ' (один номер на несколько кабинетов — одна табличка на входе в блок)',
        rooms: elRooms.slice().sort((a, b) => (a.floor - b.floor) || (a.block - b.block) || String(a.plate).localeCompare(String(b.plate), 'ru', { numeric: true })),
        siblingsLabel: (anyFilter ? 'Элементы типа ' + (tk || '—') + ' в выборке' : 'Все элементы типа ' + (tk || '—')) + ' (' + sibs.reduce((s, e) => s + qtyOf(e), 0) + ' шт.)',
        siblings: sibs.map((e) => ({ id: e.id, where: floorLabel(e.floor) + (e.block == null ? '' : ', блок ' + e.block), current: el && e === el ? 'true' : 'false', open: openEl(e.id) }))
      };
    }

    const noFilters = !q && !typeSel && FACETS.every((f) => !(sel[f.key] || []).length);
    return {
      stats: {
        shown: filtered.length, total: els.length, types: Object.keys(byType).length,
        totalLabel: 'из ' + els.length + ' ' + plural(els.length, 'элемента', 'элемента', 'элементов'),
        typesLabel: plural(Object.keys(byType).length, 'тип', 'типа', 'типов') + ' в выборке'
      },
      q: q, onQ: (ev) => this.setState({ q: ev.target.value }),
      typeSel: typeSel, onType: (ev) => this.setState({ typeSel: ev.target.value }),
      typeOptions: typeOptions, facets: facets, activeChips: activeChips, noFilters: noFilters,
      reset: () => this.setState({ q: '', sel: {}, typeSel: '' }),
      viewList: view === 'list' ? 'true' : 'false', viewTypes: view === 'types' ? 'true' : 'false',
      showList: () => this.setState({ view: 'list' }), showTypes: () => this.setState({ view: 'types' }),
      darkOn: this.state.theme === 'dark' ? 'true' : 'false',
      toggleTheme: () => this.toggleTheme(),
      goboOn: showGobo ? 'true' : 'false',
      toggleGobo: () => {
        if (showGobo) {
          const ns = Object.assign({}, sel);
          if (ns.placement) ns.placement = ns.placement.filter((v) => v !== 'Световая проекция');
          if (ns.cls) ns.cls = ns.cls.filter((v) => v !== 'gobo-1');
          const ts = typeSel && allTypes[typeSel] && allTypes[typeSel].cls === 'gobo-1' ? '' : typeSel;
          this.setState({ showGobo: false, sel: ns, typeSel: ts, open: null });
        } else this.setState({ showGobo: true, open: null });
      },
      streetOn: showStreet ? 'true' : 'false',
      toggleStreet: () => {
        if (showStreet) {
          const ns = Object.assign({}, sel);
          LOC_KEYS.forEach((k) => { if (ns[k]) ns[k] = ns[k].filter((v) => v !== 'street'); });
          const ts = typeSel && allTypes[typeSel] && allTypes[typeSel].placement === 'Уличный' ? '' : typeSel;
          this.setState({ showStreet: false, sel: ns, typeSel: ts, open: null });
        } else this.setState({ showStreet: true, open: null });
      },
      loading: !data && !error, error: !!error, errorText: error || '',
      empty: !!data && filtered.length === 0,
      showTable: !!data && view === 'list' && filtered.length > 0,
      showCards: !!data && view === 'types' && filtered.length > 0,
      rows: rows, cards: cards,
      hasKp: Object.keys(this.state.kp).length > 0, kpLabel: '\u0412\u044b\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u0441\u043f\u0438\u0441\u043e\u043a (' + Object.keys(this.state.kp).length + ')',
      kpStatus: this.state.kpStatus,
      exportKp: () => this.exportKp(), clearKp: () => this.clearKp(),
      modal: !!d, d: d || { imgs: [], elFacts: [], specs: [], siblings: [] },
      toggleSpec: () => this.setState({ showSpec: !this.state.showSpec }),
      selectAllKp: () => {
        const kp = Object.assign({}, this.state.kp);
        const allOn = filtered.length > 0 && filtered.every((e) => kp[e.id]);
        filtered.forEach((e) => { if (allOn) delete kp[e.id]; else kp[e.id] = 1; });
        kpStore(kp);
        this.setState({ kp: kp, kpStatus: '' });
      },
      shareCard: () => this.shareCard(),
      printCard: () => this.printCard(),
      shareLabel: this.state.shareMsg || 'Поделиться',
      closeModal: () => { hashSet(''); this.setState({ open: null, shareMsg: '' }); }
    };
  }
}

window.__boot=function(){window.__start(Component);};
</script>
<script>
(function(){
var K='gkb7-auth';
var f=document.getElementById('gateform'),gl=document.getElementById('gl'),gp=document.getElementById('gp'),gb=document.getElementById('gb'),ge=document.getElementById('ge');
function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
function unlock(login,pass){
  var e=window.NAV_ENC,enc=new TextEncoder(),raw=enc.encode(login+'\n'+pass);
  return crypto.subtle.importKey('raw',raw,'PBKDF2',false,['deriveKey']).then(function(km){
    var i=-1;
    function step(){
      i++;
      if(i>=e.k.length)return Promise.reject(new Error('no'));
      var ent=e.k[i];
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ent.s),iterations:e.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt'])
        .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ent.i)},k,b64(ent.w));})
        .then(function(mk){return crypto.subtle.importKey('raw',mk,{name:'AES-GCM'},false,['decrypt']);})
        .then(function(mkey){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.i)},mkey,b64(e.c));})
        .then(function(pt){return JSON.parse(new TextDecoder().decode(pt));},step);
    }
    return step();
  });
}
function open_(data,login,pass){
  window.NAV_DATA=data;window.KP_USER=login;
  try{sessionStorage.setItem(K,JSON.stringify([login,pass]));}catch(e){}
  var g=document.getElementById('gate');if(g)g.remove();
  document.getElementById('app').style.display='';
  window.__boot();
}
function tryLogin(login,pass,quiet){
  gb.disabled=true;ge.textContent=quiet?'':'Проверяем…';
  return unlock(login,pass).then(function(d){open_(d,login,pass);},function(){
    gb.disabled=false;
    if(!quiet){ge.textContent='Неверный логин или пароль';gp.value='';gp.focus();}
    else{ge.textContent='';try{sessionStorage.removeItem(K);}catch(e){}}
  });
}
f.addEventListener('submit',function(ev){ev.preventDefault();tryLogin(gl.value.trim(),gp.value,false);});
var saved=null;try{saved=JSON.parse(sessionStorage.getItem(K)||'null');}catch(e){}
if(saved&&saved.length===2){tryLogin(saved[0],saved[1],true).then(function(){gb.disabled=false;});}
else{gl.focus();}
})();
</script>
